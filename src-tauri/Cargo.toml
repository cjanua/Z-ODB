[package]
name = "z-obd"
version = "0.1.0"
description = "Z OBD Dashboard"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "z_obd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "z-obd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2",   features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-fs        = "2"
tauri-plugin-shell     = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
